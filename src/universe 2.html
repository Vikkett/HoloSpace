<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>HoloSpace - Exploration</title>
    <style>
        body { margin: 0; background: #000000; color: white; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        .ui { position: fixed; top: 20px; left: 20px; z-index: 100; pointer-events: none; }
        .mode-label { 
            background: rgba(0, 212, 255, 0.1); 
            border: 1px solid #00d4ff; 
            padding: 8px 20px; 
            border-radius: 30px; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div class="ui">
        <div id="mode-indicator" class="mode-label">Initialisation...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
 let scene, camera, renderer, stars;
let planets = []; // Array to keep track of planets for animation

window.onload = function() {
    const hasJwt = document.cookie.includes('holospace_jwt');
    const isDemo = sessionStorage.getItem('holospace_demo') === 'true';

    if (hasJwt) {
        document.getElementById('mode-indicator').innerText = "✨ Univers Personnel";
        initThree(false);
    } else if (isDemo) {
        document.getElementById('mode-indicator').innerText = "🌌 Mode Démonstration";
        initThree(true);
    } else {
        window.location.href = 'index.html';
    }
};

function initThree(isDemo) {
    // 1. Scene & Camera
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.z = 100;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 2. Lights (Crucial for 3D shapes)
    const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 3, 500); // Bright light from the center
    scene.add(sunLight);

    // 3. The Sun (Center of the Galaxy)
    const sunGeo = new THREE.SphereGeometry(12, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    // 4. Create Planets
    // In Demo mode, we generate 5 random planets
    if (isDemo) {
        for(let i = 0; i < 5; i++) {
            const size = Math.random() * 3 + 1;
            const dist = 40 + (i * 25);
            const color = new THREE.Color().setHSL(Math.random(), 0.7, 0.5);
            const speed = (Math.random() * 0.01) + 0.005;
            
            createPlanet(size, dist, color, speed);
        }
    }

    // 5. The Starfield (Background)
    const starGeometry = new THREE.BufferGeometry();
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
    const starVertices = [];
    for (let i = 0; i < 10000; i++) {
        starVertices.push((Math.random() - 0.5) * 2000, (Math.random() - 0.5) * 2000, (Math.random() - 0.5) * 2000);
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // Helper Function to build a planet
    function createPlanet(size, dist, color, speed) {
        const geo = new THREE.SphereGeometry(size, 32, 32);
        const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
        const mesh = new THREE.Mesh(geo, mat);
        
        // Custom properties for animation
        const planetObj = {
            mesh: mesh,
            distance: dist,
            speed: speed,
            angle: Math.random() * Math.PI * 2
        };
        
        planets.push(planetObj);
        scene.add(mesh);
    }

    // 6. Animation Loop
    function animate() {
        requestAnimationFrame(animate);

        // Animate Planets (Orbiting)
        planets.forEach(p => {
            p.angle += p.speed;
            p.mesh.position.x = Math.cos(p.angle) * p.distance;
            p.mesh.position.z = Math.sin(p.angle) * p.distance;
            p.mesh.rotation.y += 0.01; // Spin the planet itself
        });

        // Rotate Starfield slowly
        stars.rotation.y += 0.0002;

        renderer.render(scene, camera);
    }

    animate();

    // Window Resize Handler
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}
    </script>
</body>
</html>
