<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloSpace - AI Universe</title>
    <link rel="stylesheet" href="./css/ai-universe.css">
</head>
<body>

    <div class="ai-interface">
        <div class="header">
            <div class="status-box">
                <div id="mode-indicator">✦ AI UNIVERSE</div>
                <div class="system-time">NEURAL_LINK: ESTABLISHED // GEMINI_V1.5</div>
            </div>
            <button class="btn-exit" onclick="window.location.href='index.html'">RETOUR</button>
        </div>
    </div>

    <div class="chat-trigger" onclick="toggleChat()">⚡</div>

    <div class="chat-container" id="chat-window">
        <div class="chat-header">
            <span>Matrice de Création</span>
            <span style="cursor:pointer; font-size: 1.2rem;" onclick="toggleChat()">×</span>
        </div>
        <div id="chat-history">
            <div class="ai-msg">
                ✦ Liaison établie. Je suis prêt à traduire votre essence en cosmos. <br><br>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Décrivez votre vibe..." onkeypress="if(event.key==='Enter') askAI()">
            <button id="send-btn" onclick="askAI()">CRÉER</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

</body>
</html>
