<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloSpace - AI Universe</title>
    <link rel="stylesheet" href="./css/ai-universe.css">
</head>
<body>

    <div id="setup-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Configure ton Univers</h2>
            <form id="setup-form" onsubmit="event.preventDefault(); validateAndGo();">
                <div class="form-group">
                    <label for="setup-vibe">Décris ton mood / vibe</label>
                    <input type="text" id="setup-vibe"
                        placeholder="ex: sombre cyberpunk, doux et onirique, chaos absolu..." required>
                    <span id="vibe-error" class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label for="setup-style">Style visuel</label>
                    <select id="setup-style">
                        <option value="mystique" selected>Mystique</option>
                        <option value="realistic">Réaliste</option>
                        <option value="neon">Néon</option>
                        <option value="abstract">Abstrait</option>
                        <option value="low-poly">Low-Poly</option>
                    </select>
                </div>
                <button type="submit" id="enter-btn">ENTRER DANS L'UNIVERS</button>
            </form>
        </div>
    </div>

    <div id="customize-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h2>Personnaliser l'Univers</h2>
            <form id="customize-form" onsubmit="event.preventDefault(); applyCustomize();">
                <div class="form-group">
                    <label for="custom-vibe">Mood / vibe</label>
                    <input type="text" id="custom-vibe"
                        placeholder="ex: sombre cyberpunk, doux et onirique..." required>
                    <span id="custom-vibe-error" class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label for="custom-style">Style visuel</label>
                    <select id="custom-style">
                        <option value="mystique">Mystique</option>
                        <option value="realistic">Réaliste</option>
                        <option value="neon">Néon</option>
                        <option value="abstract">Abstrait</option>
                        <option value="low-poly">Low-Poly</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button type="button" onclick="closeCustomize()"
                        style="flex:1; padding:16px; background:transparent;
                               border:1px solid rgba(255,255,255,0.2); border-radius:10px;
                               color:white; cursor:pointer; font-size:0.9rem;
                               letter-spacing:2px; text-transform:uppercase; transition:0.3s;"
                        onmouseover="this.style.background='rgba(255,255,255,0.05)'"
                        onmouseout="this.style.background='transparent'">
                        ANNULER
                    </button>
                    <button type="submit"
                        style="flex:2; padding:16px; background:#00d4ff; border:none;
                               border-radius:10px; color:#001428; font-weight:bold;
                               font-size:1rem; letter-spacing:3px; text-transform:uppercase;
                               cursor:pointer; transition:0.3s;"
                        onmouseover="this.style.background='#fff'"
                        onmouseout="this.style.background='#00d4ff'">
                        APPLIQUER
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="ai-interface">
        <div class="header">
            <div class="status-box">
                <div id="mode-indicator">✦ AI UNIVERSE</div>
                <div class="system-time">Your personnal creator</div>
            </div>
            <div style="display:flex; gap:10px; pointer-events:auto;">
                <button id="customize-btn" class="btn-customize"
                    style="display:none;" onclick="openCustomize()">
                    ✦ PERSONNALISER
                </button>
                <button class="btn-exit" onclick="window.location.href='index.html'">RETOUR</button>
            </div>
        </div>
    </div>

    <div class="chat-trigger" id="chat-trigger" onclick="toggleChat()">⚡</div>

    <div class="chat-container" id="chat-window">
        <div class="chat-header">
            <span>Matrice de Création</span>
            <span onclick="toggleChat()" style="cursor:pointer;">×</span>
        </div>
        <div id="chat-history">
            <div class="ai-msg">✦ Liaison établie. Je suis prêt à traduire votre essence en cosmos.</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Décrivez votre vibe...">
            <button id="send-btn">CRÉER</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="./domain/ai-universe-domain.js"></script>
    <script src="./persistance/ai-univers-persistance.js"></script>
    <script src="./presentation/ai-universe-presentation.js"></script>
</body>
</html>
