<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloSpace - AI Universe</title>
    <link rel="stylesheet" href="./css/ai-universe.css">
</head>
<body>

    <!-- Modal overlay -->
    <div id="setup-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Configure ton Univers</h2>
            
            <form id="setup-form" onsubmit="event.preventDefault(); validateAndGo();">
                
                <!-- Free text: mood/vibe -->
                <div class="form-group">
                    <label for="setup-vibe">Décris ton mood / vibe</label>
                    <input 
                        type="text" 
                        id="setup-vibe" 
                        placeholder="ex: sombre cyberpunk, doux et onirique, chaos absolu..." 
                        required
                    >
                    <span id="vibe-error" class="error-msg"></span>
                </div>

                <!-- Style selector -->
                <div class="form-group">
                    <label for="setup-style">Style visuel</label>
                    <select id="setup-style" required>
                        <option value="" disabled selected>Choisis un style</option>
                        <option value="realistic">Réaliste</option>
                        <option value="low-poly">Low-Poly</option>
                        <option value="neon">Néon</option>
                        <option value="abstract">Abstrait</option>
                    </select>
                </div>

                <button type="submit">ENTRER DANS L'UNIVERS</button>
            </form>
        </div>
    </div>

    <div class="ai-interface">
        <div class="header">
            <div class="status-box">
                <div id="mode-indicator">✦ AI UNIVERSE</div>
                <div class="system-time">NEURAL_LINK: ESTABLISHED // Groq</div>
            </div>
            <button class="btn-exit" onclick="window.location.href='index.html'">RETOUR</button>
        </div>
    </div>

    <div class="chat-trigger" onclick="toggleChat()" style="display:none;">⚡</div>

    <div class="chat-container" id="chat-window" style="display:none;">
        <div class="chat-header">
            <span>Matrice de Création</span>
            <span onclick="toggleChat()" style="cursor:pointer;">×</span>
        </div>
    
        <div id="chat-history">
            <div class="ai-msg">
                ✦ Liaison établie. Je suis prêt à traduire votre essence en cosmos.
            </div>
        </div>
    
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Décrivez votre vibe..." 
                   onkeypress="if(event.key==='Enter') handleUserMsg()">
            <button id="send-btn" onclick="handleUserMsg()">CRÉER</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="./js/ai-universe.js"></script>
    
    </body>
</html>
